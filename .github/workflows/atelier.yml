# Atelier d'expériences : exécute chaque commande poussée dans commandes/<jour>/, puis publie l'expérience validée
# dans un dépôt public daté. Fichier synchronisé à chaque envoi de commandes : ne pas modifier ici.
#
# Sécurité : aucun déclencheur sur les pull requests (les secrets restent inaccessibles aux forks). Le code écrit par
# le modèle s'exécute seulement dans le conteneur du sandbox (sans secret, sans privilège, sans accès aux services de
# métadonnées) ou sur une machine Colab sans secret. Le jeton de publication n'existe qu'à l'étape de publication.
name: Atelier d'expériences

on:
  push:
    branches: [main]
    paths: ["commandes/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atelier
  cancel-in-progress: false

jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.liste.outputs.gpu }}
      cpu: ${{ steps.liste.outputs.cpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Matériel de l'échelle complète, décidé d'après la commande (materiel_complet) : une seule machine Colab à la fois,
      # les expériences sur CPU en parallèle (une machine du runner chacune).
      - id: liste
        run: |
          echo "gpu=$(python -m lab.atelier lister --materiel gpu)" >> "$GITHUB_OUTPUT"
          echo "cpu=$(python -m lab.atelier lister --materiel cpu)" >> "$GITHUB_OUTPUT"

  poc-gpu:
    needs: liste
    if: needs.liste.outputs.gpu != '[]'
    uses: ./.github/workflows/atelier-poc.yml
    with:
      commandes: ${{ needs.liste.outputs.gpu }}
      parallele: 1
      groupe: gpu
    secrets: inherit

  poc-cpu:
    needs: liste
    if: needs.liste.outputs.cpu != '[]'
    uses: ./.github/workflows/atelier-poc.yml
    with:
      commandes: ${{ needs.liste.outputs.cpu }}
      parallele: 3
      groupe: cpu
    secrets: inherit
